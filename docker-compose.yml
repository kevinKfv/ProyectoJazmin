services:
  db:
    image: postgres:15-alpine
    container_name: sewstudio-db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sewstudio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d sewstudio"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sewstudio-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://root:password@db:5432/sewstudio?schema=public
      - AUTH_SECRET=sewstudio_super_secret_local_key_123456789
      - NEXTAUTH_SECRET=sewstudio_super_secret_local_key_123456789
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_URL=http://localhost:3000
      - NODE_ENV=production
      - PORT=3000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads

volumes:
  postgres_data:
  uploads_data:
