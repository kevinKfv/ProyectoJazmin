services:
  # Servicio Web Next.js para Render
  - type: web
    name: sewstudio-web
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: sewstudio-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: GROQ_API_KEY
        sync: false

databases:
  # Base de Datos PostgreSQL gestionada en Render
  - name: sewstudio-db
    databaseName: sewstudio
    user: sewstudio_user
    plan: free
    region: ohio
